# Organisation fictive de la caisse d'investissement.
# Les BPMN/DMN et le catalogue ne connaissent que des RÔLES. Ce fichier dit qui les tient.
# Un membre de rôle est soit l'id d'une personne, soit « equipe:<id> » (tous les membres de l'équipe).
# Changement organisationnel = modifier ce fichier (aucun redéploiement BPMN) — voir docs/playbooks.

equipes:
